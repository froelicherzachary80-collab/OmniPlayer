[workspace]
resolver = "2"
members = ["services/omnicore", "services/omnibrain", "services/omniview"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"

[profile.release]
opt-level = 3
debug = false
